<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070708">
  <title>Gallery · Bezze Customz</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Cinzel:wght@600&family=Outfit:wght@500;600&family=Libre+Baskerville&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="sticky-top">
    <p class="test-banner">Test site · sample designs only · no payment is taken</p>
    <header class="site-header">
      <a class="logo" href="index.html">Bezze <em>Customz</em></a>
      <div class="header-actions">
        <a class="bag-link" href="checkout.html">Bag <span id="bag-count">(0)</span></a>
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
  </div>
  <noscript><p class="noscript">This test shop draws the sample designs in your browser and needs JavaScript.</p></noscript>
  <main class="wrap gallery-tools">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search designs" autocomplete="off">
    </label>
    <div class="cats" id="cats" role="group" aria-label="Categories"></div>
    <div class="filters">
      <div class="chips" id="colours" role="group" aria-label="Colours"></div>
      <label class="sort">
        <span class="sr">Sort</span>
        <select id="sort">
          <option value="popular">Popular</option>
          <option value="newest">Newest</option>
          <option value="az">A–Z</option>
        </select>
      </label>
    </div>
    <p class="count-line" id="count">Sample designs</p>
    <p class="hint" id="empty" hidden>No sample designs match that search.</p>
    <div class="grid" id="grid"></div>
  </main>
  <footer class="site-foot">Prices in CAD · Sample artwork only · Bezze Customz</footer>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
